<!DOCTYPE html>
<!-- ====================================================================
     STRANICA EDITORA (T6, spec §9.13)

     Do T6 je editor bio deveta sekcija u `index.html`, pa je 244 KiB editorskog koda
     stizalo SVAKOM posjetitelju — i onome bez računa, koji ga nikad neće otvoriti.
     Ovdje je zato zasebna stranica: `index.html` je izgubio editorske skripte, a ova
     ih nosi. „Uvjetno učitavanje" time nije mehanizam nego POSLJEDICA rasporeda.

     ⚠️ SADRŽAJ SEKCIJA JE NAMJERNO PRAZAN. `#admin-page` puni `renderAdminPage()`,
     `#editor-page` puni `renderStudioPage()` — oba iz JS-a, kao i u aplikaciji. Ova
     datoteka je LJUSKA: traka, mrvica, čuvar pristupa i popis skripti.

     ⚠️ `noindex` NIJE opreznost nego posljedica toga da editor sad ima pravu adresu.
     Tražilica koja je indeksira nudila bi ljudima ulaz u alat u koji ne mogu ući.
     ==================================================================== -->

<body>
<script src="js/boot.js?v=20261003051209"></script>
<!-- ADR-034: štipanje s dva prsta gasi JS, jer Safari metu ignorira — zašto piše u js/no-zoom.js -->
<script src="js/no-zoom.js?v=20261003051209" defer></script>

    <!-- Ista ljuska kao u aplikaciji (K2b): `#editor-page` je `position:fixed` s
         `inset: var(--chrome-h) 0 0 0`, pa traka mora postojati i ovdje — inače bi
         Studio počeo od vrha ekrana i pojeo vlastiti izlaz. -->
    <div class="chrome" id="chrome">
    <header class="topbar" id="top" role="banner">
        <a class="topbar-logo" href="index.html" id="topbarHome" aria-label="Sokrat Study">
            <img src="assets/logo.svg?v=20261003051209" alt="" class="logo-image">
            <span class="logo-text">Sokrat Study</span>
        </a>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions">
            <button type="button" class="topbar-btn topbar-lang" data-action="toggleUiLang" aria-label="Language / Jezik" title="Language / Jezik" data-i18n-aria="topbar.lang" data-i18n-title="topbar.lang">
                <i class="fas fa-globe" aria-hidden="true"></i>
                <span class="lang-toggle-label" data-i18n="topbar.langCode">EN</span>
            </button>
            <button type="button" class="topbar-btn auth-entry" id="authNavBtn" hidden>
                <i class="fas fa-user" aria-hidden="true"></i>
                <span class="auth-entry-label topbar-btn-label" id="authNavLabel" data-i18n="auth.signIn">Sign in</span>
            </button>
        </div>
    </header>

    <div class="pathbar" id="pathbar">
        <button type="button" class="pathbar-back" id="pathbarBack" aria-label="Go back" data-i18n-aria="topbar.back">
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" data-i18n-aria="topbar.crumbs"></nav>
    </div>
    </div><!-- /.chrome -->

    <!-- ČUVAR: stoji IZNAD editora dok se identitet ne razriješi. Ovo je jedina razlika
         prema aplikaciji i postoji jer editor sad ima adresu koju svatko može utipkati
         (v. `js/editor-page.js`). Prazan editor se NIKAD ne smije vidjeti. -->
    <div class="ed-guard" id="edGuard" role="status" aria-live="polite">
        <p class="ed-guard-msg" id="edGuardMsg" data-i18n="editor.checking">Checking your access…</p>
        <button type="button" class="cta-button primary" id="edGuardBack" hidden data-i18n="editor.backToMaterials">Back to my materials</button>
    </div>

    <!-- Sadržaj obiju sekcija crta JS (renderAdminPage / renderStudioPage). -->
    <section id="admin-page" class="admin-page">
        <header class="profile-header">
            <h1 data-i18n="admin.title">Admin</h1>
            <div style="width: 44px;"></div>
        </header>
        <main class="profile-content w-full max-w-[860px] mx-auto" id="adminContent"></main>
    </section>

    <section id="editor-page" class="studio-page"></section>

    <sokrat-toast class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage"></span>
    </sokrat-toast>

    <sokrat-confirm id="confirmDialog"></sokrat-confirm>

    <!-- ==================== SKRIPTE ====================
         Popis je IZVEDEN, ne prepisan: svaka je ovdje jer je neka editorska datoteka
         traži (`t`, `showToast`, `askConfirm`, `SokratDraft`, `SokratAuth`, `SokratCatalog`,
         `SokratContent`, `SokratBlocks`, `SokratNodeImages`, `AppState`, `SokratCardLimits`).
         ⚠️ `js/navigation.js` NIJE ovdje: ruter i devet stranica pripadaju aplikaciji, a
         editor od njega treba samo `navigateTo`/`goBack` — to prevodi `js/editor-page.js`.
         ⚠️ `js/admin-reveal.js` MORA prije `js/admin.js` (studioBridge se veže pri parsiranju). -->
    <script src="data/catalog.js?v=20261003051209"></script>
