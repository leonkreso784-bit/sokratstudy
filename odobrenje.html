<!DOCTYPE html>
<html lang="en" data-theme="academic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Connect your AI — Sokrat Study</title>
    <!-- F6 ①/1: stranica na koju Supabase OAuth poslužitelj šalje korisnika kad njegov AI (Claude,
         ChatGPT) traži pristup (`Authorization Path` = /odobrenje.html). NE indeksira se: bez
         `authorization_id` nema smisla. (robots.txt je NE zabranjuje — inače `noindex` nitko ne bi
         pročitao; v. check:seo.) -->
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="assets/logo.svg?v=20261001195501">
    <link rel="stylesheet" href="css/tokens.static.css?v=20261001195501">
    <link rel="stylesheet" href="css/legal.css?v=20261001195501">
    <script src="js/no-zoom.js?v=20261001195501" defer></script>
    <script src="js/i18n.js?v=20261001195501" defer></script>
    <script src="js/odobrenje.js?v=20261001195501" defer></script>
</head>
<body>
<script src="js/boot.js?v=20261001195501"></script>
    <header class="legal-nav">
        <a class="legal-logo" href="/"><img src="assets/logo.svg?v=20261001195501" alt="Sokrat Study">Sokrat Study</a>
        <!-- Oznaku („EN"/„HR") upiše `i18n.js` kroz ključ `topbar.langCode` — prazna je dok JS ne stigne. -->
        <button type="button" class="legal-back legal-lang" data-action="toggleUiLang" data-i18n-aria="legal.lang" aria-label="Language / Jezik">
            <span class="lang-toggle-label" data-i18n="topbar.langCode"></span>
        </button>
    </header>

    <!-- Otvaranje stranice NIŠTA ne odobrava — tek gumb „Dopusti". Pristup se daje samo klijentu
         koji se vraća na poznat host (ADR-038 ③): DCR pušta bilo koga da se registrira. -->
    <main class="legal oauth">
        <h1 data-i18n="oauth.title">Connect your AI to Sokrat Study</h1>
        <div class="oauth-details" id="oauthDetails" hidden>
            <p><span data-i18n="oauth.client">App</span>: <strong id="oauthClient"></strong></p>
            <p><span data-i18n="oauth.host">Returns to</span>: <strong id="oauthHost"></strong></p>
            <p><span data-i18n="oauth.account">Your account</span>: <strong id="oauthAccount"></strong></p>
            <p data-i18n="oauth.scope">It will be able to see your own study materials. It never sees other people's materials.</p>
        </div>
        <p class="oauth-actions" id="oauthActions" hidden>
            <button type="button" class="unsub-btn" id="oauthAllow" data-i18n="oauth.allow">Allow</button>
            <button type="button" class="oauth-deny" id="oauthDeny" data-i18n="oauth.deny">Deny</button>
        </p>
        <p class="unsub-status" id="oauthStatus" role="status" aria-live="polite"></p>
        <!-- Prijava ide u DRUGI prozor: `authorization_id` stoji u adresi OVE stranice, pa bi
             odlazak s nje značio novo povezivanje iz AI aplikacije (izmjereno 18.09.). -->
        <p id="oauthSignin" hidden>
            <button type="button" class="unsub-btn" id="oauthSigninBtn" data-i18n="oauth.signinLink">Sign in to Sokrat Study</button>
        </p>
    </main>
</body>
</html>
